<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 语音助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #4c6fff;
      --primary-hover: #3b5de7;
      --primary-light: #e8ecff;
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #666;
      --text-muted: #999;
      --border: #e8e8ee;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }

    .app {
      width: 100%; max-width: 820px; height: 100vh;
      background: var(--surface);
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* 头部 — 豆包风格简洁导航 */
    .header {
      padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header .logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4c6fff, #6c5ce7);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff;
    }
    .header h1 {
      font-size: 17px; font-weight: 600; color: var(--text);
      letter-spacing: -0.3px;
    }

    /* 右侧操作区 */
    .header-actions {
      margin-left: auto; display: flex; align-items: center; gap: 10px;
    }
    .tts-toggle {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface); cursor: pointer;
      font-size: 13px; color: var(--text-secondary);
      user-select: none; transition: all 0.2s;
      font-family: inherit; white-space: nowrap;
    }
    .tts-toggle:hover { background: var(--bg); }
    .tts-toggle.active {
      color: var(--primary); border-color: var(--primary);
      background: var(--primary-light);
    }
    .tts-toggle .toggle-icon { font-size: 15px; transition: all 0.2s; }

    /* 消息列表 */
    .messages {
      flex: 1; overflow-y: auto; padding: 20px 24px 12px;
      display: flex; flex-direction: column; gap: 18px;
      background: var(--surface);
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* 每条消息 = 气泡 */
    .msg-row {
      display: flex; gap: 10px; align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }
    .msg-row.user { flex-direction: row-reverse; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .msg {
      max-width: 75%; padding: 11px 16px;
      border-radius: var(--radius-md); line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
      font-size: 14.5px; position: relative;
    }
    .msg-row.user .msg {
      background: var(--primary-light);
      color: #1a1a3e;
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .msg {
      background: #f7f7fa; color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg-row.assistant .msg.streaming::after {
      content: "▊"; animation: blink 1s step-end infinite;
      color: var(--primary); margin-left: 2px;
    }
    .msg-row.assistant .msg.speaking {
      box-shadow: 0 0 0 2px rgba(76,111,255,0.2);
    }
    @keyframes blink { 50% { opacity: 0; } }

    .msg.system {
      align-self: center; font-size: 13px; color: var(--text-muted);
      background: transparent; padding: 4px 12px;
      text-align: center;
    }

    /* 状态条 */
    .status-bar {
      text-align: center; padding: 0 24px 6px;
      font-size: 12.5px; color: var(--text-muted); min-height: 20px;
      flex-shrink: 0; background: var(--surface);
    }
    .status-bar.recording { color: var(--primary); font-weight: 600; }
    .status-bar.transcribing { color: #f0a030; }
    .status-bar.speaking { color: var(--primary); }

    /* 欢迎区（无消息时显示）*/
    .welcome-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px; gap: 24px;
    }
    .welcome-area .greeting {
      font-size: 24px; font-weight: 600; color: var(--text);
      letter-spacing: -0.5px;
    }
    .welcome-area .subtitle {
      font-size: 13px; color: var(--text-muted);
    }

    /* 底部输入区 — 豆包风格大圆角 */
    .input-area {
      padding: 8px 16px 12px;
      display: flex; align-items: flex-end; gap: 10px;
      flex-shrink: 0; background: var(--surface);
    }

    .mic-btn {
      width: 42px; height: 42px; min-width: 42px;
      border-radius: 50%; border: 2px solid #e0e0e8;
      background: var(--surface); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; outline: none; flex-shrink: 0;
    }
    .mic-btn:hover { background: var(--bg); border-color: var(--primary); }
    .mic-btn.recording {
      background: var(--primary); border-color: var(--primary);
      animation: micPulse 1.2s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(76,111,255,0.4); }
      50% { box-shadow: 0 0 0 14px rgba(76,111,255,0); }
    }
    .mic-btn svg { width: 20px; height: 20px; transition: all 0.2s; }
    .mic-btn .mic-on { fill: #888; }
    .mic-btn:hover .mic-on { fill: var(--primary); }
    .mic-btn.recording .mic-on { fill: #fff; }
    .mic-btn .mic-off { display: none; fill: #fff; width: 15px; height: 15px; }
    .mic-btn.recording .mic-on { display: none; }
    .mic-btn.recording .mic-off { display: block; }
    .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }

    .text-input-wrap {
      flex: 1; position: relative;
      background: var(--bg); border-radius: 24px;
      border: 2px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .text-input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(76,111,255,0.1);
    }
    .text-input-wrap textarea {
      width: 100%; padding: 10px 16px;
      border-radius: 24px; border: none;
      background: transparent; color: var(--text);
      font-size: 14.5px; font-family: inherit;
      line-height: 1.5; resize: none; outline: none;
      max-height: 100px;
    }
    .text-input-wrap textarea::placeholder { color: #bbb; }

    .send-btn {
      width: 42px; height: 42px; min-width: 42px;
      border-radius: 50%; border: none;
      background: var(--primary); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* 响应式 */
    @media (max-width: 520px) {
      .app { height: 100dvh; border-radius: 0; }
      .messages { padding: 14px 14px 8px; }
      .msg { max-width: 85%; }
      .header { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部 — 豆包风导航 -->
    <div class="header">
      <h1>AI 助手</h1>
      <div class="header-actions">
        <div class="tts-toggle active" id="ttsToggle" title="切换语音朗读">
          <span class="toggle-icon">🔊</span>
          <span id="ttsLabel">语音开</span>
        </div>

      </div>
    </div>

    <!-- 消息列表 & 欢迎区 -->
    <div class="messages" id="messages">
      <div class="welcome-area" id="welcomeArea">
        <div class="greeting">有什么我能帮你的吗？</div>
        <div class="subtitle">按住麦克风说话，或输入文字开始对话</div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar"></div>

    <!-- 底部输入区 — 豆包风大圆角 -->
    <div class="input-area">
      <button class="mic-btn" id="micBtn" title="按住录音">
        <svg class="mic-on" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/></svg>
        <svg class="mic-off" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <div class="text-input-wrap">
        <textarea id="textInput" rows="1" placeholder="发消息..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn" title="发送">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    // DOM 元素
    const messagesEl = document.getElementById("messages");
    const welcomeArea = document.getElementById("welcomeArea");
    const statusBar = document.getElementById("statusBar");
    const micBtn = document.getElementById("micBtn");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const ttsToggle = document.getElementById("ttsToggle");
    const ttsLabel = document.getElementById("ttsLabel");

    // 状态
    let mediaRecorder = null;
    let audioChunks = [];
    let stream = null;
    let isRecording = false;
    let isProcessing = false;
    let activeAbortController = null;
    let ttsEnabled = true;
    let currentAssistantMsg = null;

    // TTS 语音开关
    ttsToggle.addEventListener("click", () => {
      ttsEnabled = !ttsEnabled;
      if (ttsEnabled) {
        ttsToggle.classList.add("active");
        ttsToggle.querySelector(".toggle-icon").textContent = "🔊";
        ttsLabel.textContent = "语音开";
      } else {
        ttsToggle.classList.remove("active");
        ttsToggle.querySelector(".toggle-icon").textContent = "🔇";
        ttsLabel.textContent = "语音关";
      }
    });


    // 麦克风录音
    micBtn.addEventListener("mousedown", startRecording);
    micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
    micBtn.addEventListener("mouseup", stopRecording);
    micBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); });
    micBtn.addEventListener("mouseleave", () => { if (isRecording) stopRecording(); });

    async function startRecording() {
      if (isProcessing || isRecording) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        setStatus("🎤 正在录音...", "recording");
      } catch (err) {
        console.error("麦克风错误:", err);
        setStatus("无法访问麦克风", "");
        isRecording = false;
      }
    }

    async function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state !== "recording") return;
      isRecording = false;
      mediaRecorder.stop();
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
      micBtn.classList.remove("recording");
      mediaRecorder.onstop = async () => {
        if (audioChunks.length === 0) { setStatus("未录到音频", ""); return; }
        await transcribeAndChat();
      };
    }

    // 语音识别 → 自动对话
    async function transcribeAndChat() {
      isProcessing = true;
      micBtn.disabled = true;
      sendBtn.disabled = true;
      setStatus("🔉 正在识别语音...", "transcribing");

      try {
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        const base64 = await blobToBase64(blob);
        const asrRes = await fetch("/api/asr", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audio: base64 }),
        });
        const asrData = await asrRes.json();
        if (!asrRes.ok || asrData.error) throw new Error(asrData.error || "语音识别失败");

        const recognizedText = asrData.text;
        if (!recognizedText || !recognizedText.trim()) {
          setStatus("未识别到内容", "");
          isProcessing = false; micBtn.disabled = false; sendBtn.disabled = false;
          return;
        }
        console.log("识别结果:", recognizedText);
        addMessage("user", recognizedText);
        setStatus("🤔 AI 思考中...", "");
        await streamChat(recognizedText);
      } catch (err) {
        console.error("处理失败:", err);
        addSystemMessage(`${err.message}`);
        setStatus("", "");
      } finally {
        isProcessing = false;
        micBtn.disabled = false;
        sendBtn.disabled = false;
      }
    }

    // 文本发送
    sendBtn.addEventListener("click", sendTextMessage);
    textInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendTextMessage(); }
    });
    textInput.addEventListener("input", () => {
      textInput.style.height = "auto";
      textInput.style.height = Math.min(textInput.scrollHeight, 100) + "px";
    });

    async function sendTextMessage() {
      const text = textInput.value.trim();
      if (!text || isProcessing) return;
      textInput.value = "";
      textInput.style.height = "auto";
      isProcessing = true;
      micBtn.disabled = true;
      sendBtn.disabled = true;
      addMessage("user", text);
      setStatus("🤔 AI 思考中...", "");
      await streamChat(text);
      isProcessing = false;
      micBtn.disabled = false;
      sendBtn.disabled = false;
      textInput.focus();
    }

    // fetch + ReadableStream 流式聊天 + TTS 语音朗读
    async function streamChat(message) {
      // 取消上一个请求
      if (activeAbortController) {
        activeAbortController.abort();
        activeAbortController = null;
      }

      const abortController = new AbortController();
      activeAbortController = abortController;

      currentAssistantMsg = addMessage("assistant", "", true);
      let fullContent = "";

      // TTS 相关
      let ttsWs = null;
      let ttsBuffer = "";
      const TTS_CHUNK_SIZE = 15;
      const audioPlayer = new AudioPlayer();

      if (ttsEnabled) {
        ttsWs = connectTTS(audioPlayer, currentAssistantMsg);
      }

      const cleanup = () => {
        currentAssistantMsg.classList.remove("streaming");
        activeAbortController = null;
      };

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
          signal: abortController.signal,
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          // 保留最后一个不完整的行
          buffer = lines.pop() || "";

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = line.slice(6);

            if (data === "[DONE]") {
              cleanup();
              if (ttsWs && ttsWs.readyState === WebSocket.OPEN) {
                if (ttsBuffer.trim()) {
                  // 将 llm 回答的文本消息发给 TTS WebSocket（阿里云实时语音合成服务）
                  ttsWs.send(JSON.stringify({ type: "text", data: ttsBuffer }));
                  ttsBuffer = "";
                }
                ttsWs.send(JSON.stringify({ type: "finish" }));
              } else {
                setStatus("", "");
              }
              return;
            }

            try {
              const parsed = JSON.parse(data);
              if (parsed.error) {
                currentAssistantMsg.textContent = `${parsed.error}`;
                cleanup();
                if (ttsWs?.readyState === WebSocket.OPEN) ttsWs.send(JSON.stringify({ type: "finish" }));
                setStatus("", "");
                return;
              }
              if (parsed.content) {
                fullContent += parsed.content;
                currentAssistantMsg.textContent = fullContent;
                messagesEl.scrollTop = messagesEl.scrollHeight;

                if (ttsWs && ttsWs.readyState === WebSocket.OPEN) {
                  ttsBuffer += parsed.content;
                  if (/[。！？!?\n]/.test(parsed.content) || ttsBuffer.length >= TTS_CHUNK_SIZE) {
                    // 将 llm 回答的文本消息发给 TTS WebSocket（阿里云实时语音合成服务）
                    ttsWs.send(JSON.stringify({ type: "text", data: ttsBuffer }));
                    ttsBuffer = "";
                  }
                }
              }
            } catch (e) { /* ignore */ }
          }
        }

        // 流意外结束（没有收到 [DONE]）
        cleanup();
        if (!fullContent) currentAssistantMsg.textContent = "连接失败";
        if (ttsWs?.readyState === WebSocket.OPEN) {
          if (ttsBuffer.trim()) ttsWs.send(JSON.stringify({ type: "text", data: ttsBuffer }));
          ttsWs.send(JSON.stringify({ type: "finish" }));
        }
        setStatus("", "");
      } catch (err) {
        if (err.name === "AbortError") {
          // 请求被取消，静默处理
          console.log("请求已取消");
          return;
        }
        console.error("Stream error:", err);
        cleanup();
        if (!fullContent) currentAssistantMsg.textContent = "连接失败";
        if (ttsWs?.readyState === WebSocket.OPEN) {
          if (ttsBuffer.trim()) ttsWs.send(JSON.stringify({ type: "text", data: ttsBuffer }));
          ttsWs.send(JSON.stringify({ type: "finish" }));
        }
        setStatus("", "");
      }
    }

    // TTS WebSocket 连接
    function connectTTS(audioPlayer, assistantMsg) {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws/tts`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("🔊 TTS WebSocket 已连接");
        setStatus("🔊 AI 正在说话...", "speaking");
        if (assistantMsg) assistantMsg.classList.add("speaking");
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "audio" && msg.data) {
            audioPlayer.enqueue(msg.data);
          } else if (msg.type === "done") {
            console.log("🔇 TTS 播放完成");
            audioPlayer.onAllDone = () => {
              setStatus("", "");
              if (assistantMsg) assistantMsg.classList.remove("speaking");
            };
            audioPlayer.waitForFinish();
            ws.close();
          } else if (msg.type === "error") {
            console.error("TTS 错误:", msg.message);
            setStatus("", "");
            if (assistantMsg) assistantMsg.classList.remove("speaking");
            ws.close();
          }
        } catch (e) { /* ignore */ }
      };

      ws.onerror = () => {
        console.error("TTS WebSocket 连接错误");
        setStatus("", "");
        if (assistantMsg) assistantMsg.classList.remove("speaking");
      };

      ws.onclose = () => {
        console.log("🔇 TTS WebSocket 已关闭");
        if (audioPlayer.isPlaying()) {
          audioPlayer.onAllDone = () => {
            setStatus("", "");
            if (assistantMsg) assistantMsg.classList.remove("speaking");
          };
          audioPlayer.waitForFinish();
        }
      };

      return ws;
    }

    // 音频播放器（基于 AudioContext 队列播放
    class AudioPlayer {
      constructor() {
        this.ctx = null;
        this.queue = [];
        this.isPlaying_ = false;
        this.nextStartTime = 0;
        this.onAllDone = null;
        this.scheduledCount = 0;
        this.finishedCount = 0;
      }

      _ensureContext() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.nextStartTime = this.ctx.currentTime;
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume();
        }
      }

      enqueue(base64Data) {
        this._ensureContext();
        this.queue.push(base64Data);
        if (this.ctx.state === "suspended") this.ctx.resume();
        if (!this.isPlaying_) {
          this.isPlaying_ = true;
          this._playNext();
        }
      }

      async _playNext() {
        if (this.queue.length === 0) {
          this.isPlaying_ = false;
          this._checkAllDone();
          return;
        }

        const base64Data = this.queue.shift();
        try {
          const binaryStr = atob(base64Data);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          const audioBuffer = await this.ctx.decodeAudioData(bytes.buffer);

          const source = this.ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(this.ctx.destination);

          const now = this.ctx.currentTime;
          if (this.nextStartTime < now) this.nextStartTime = now;
          source.start(this.nextStartTime);
          this.nextStartTime += audioBuffer.duration;

          this.scheduledCount++;
          source.onended = () => {
            this.finishedCount++;
            this._checkAllDone();
          };

          this._playNext();
        } catch (err) {
          console.error("音频解码失败:", err);
          this._playNext();
        }
      }

      _checkAllDone() {
        if (this.queue.length === 0 && this.finishedCount >= this.scheduledCount && this.onAllDone) {
          this.onAllDone();
          this.onAllDone = null;
          this.scheduledCount = 0;
          this.finishedCount = 0;
        }
      }

      waitForFinish() {
        this._checkAllDone();
      }

      isPlaying() {
        return this.isPlaying_ || this.finishedCount < this.scheduledCount;
      }
    }

    // 辅助函数
    function addMessage(role, text, isStreaming = false) {
      // 首次发送消息时隐藏欢迎区
      if (welcomeArea && welcomeArea.style.display !== "none") {
        welcomeArea.style.display = "none";
      }

      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      // 气泡
      const bubble = document.createElement("div");
      bubble.className = "msg" + (isStreaming ? " streaming" : "");
      bubble.textContent = text;
      row.appendChild(bubble);

      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.className = "msg system";
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setStatus(text, className) {
      statusBar.textContent = text;
      statusBar.className = "status-bar " + (className || "");
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }
  </script>
</body>
</html>
